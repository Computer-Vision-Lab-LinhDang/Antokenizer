[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atoken"
version = "0.1.0"
description = "MAVT: Memory-Augmented Vision Tokenizer"
requires-python = ">=3.10"

dependencies = [
    # Core deep learning
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    # Vision backbone (SigLIP2)
    "transformers>=4.38.0",
    "huggingface-hub>=0.20.0",
    # Image processing
    "Pillow>=10.0.0",
    # Numerics / utils (stdlib-only in this repo, but common research deps)
    "numpy>=1.24.0",
    "lightning>=2.6.1",
    "requests>=2.32.5",
    "torchviz>=0.0.3",
    "torchview>=0.2.6",
]

[project.optional-dependencies]
# Perceptual loss (optional — only needed when use_lpips=True)
lpips = [
    "lpips>=0.1.4",
]

# Distributed training
dist = [
    "accelerate>=0.26.0",
]

# Experiment tracking
logging = [
    "wandb>=0.16.0",
    "tensorboard>=2.15.0",
]

# Development & testing
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

# All optional extras
all = [
    "atoken[lpips,dist,logging,dev]",
]

[tool.hatch.build.targets.wheel]
packages = ["atoken"]

# ─── uv settings ──────────────────────────────────────────────────────────────

[tool.uv]
# PyTorch from the official index (CPU by default; see below for CUDA)
index-url = "https://pypi.org/simple"

# CUDA variants — uncomment the one matching your driver:
# extra-index-url = "https://download.pytorch.org/whl/cu121"   # CUDA 12.1
# extra-index-url = "https://download.pytorch.org/whl/cu118"   # CUDA 11.8
# extra-index-url = "https://download.pytorch.org/whl/cpu"     # CPU only

# ─── pytest ───────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
