# MAVT on DINOv3 v1 phase 1 -- training on "alpha" (AMD / ROCm, GPUs 1,2,3).
#
# Same model as v0_alpha.yaml plus the v1 phase-1 options (config.py "v1 phase 1" block):
#   per-query Δ, conv rgb head (full frames, no patch grid), hinge gate loss (D may be used, only
#   penalised when it takes over), warp-only loss (Δ must carry the motion), residual multi-horizon
#   forecasts (start as copy-last) with an rgb term, LPIPS + Gram on full frames.
#
# Top-level keys are DinoV0Config fields (src/mavt/dino_v0/config.py); `train:` holds
# defaults for scripts/train_dino_v0.py flags (anything on the command line wins).
#
# 0) one-off: a video decoder and LPIPS in the env      pip install av lpips
#    (LPIPS loads torchvision's ImageNet VGG16 weights on first use: make sure they are in the torch hub cache)
# 1) loader throughput check (no model, ~1 min):
#    python scripts/train_dino_v0.py --config configs/dino_v0/v1_alpha.yaml \
#      --out /scratch/vunguyen13/mavt/runs/mavt-v1-alpha --bench-data 50
# 2) launch inside tmux (auto-resumes from <out>/last.pt; SIGTERM / Ctrl-C saves last.pt):
#    tmux new -s mavt-v1
#    cd ~/Antokenizer && CUDA_VISIBLE_DEVICES=1,2,3 torchrun --standalone --nproc_per_node 3 \
#      scripts/train_dino_v0.py --config configs/dino_v0/v1_alpha.yaml \
#      --out /scratch/vunguyen13/mavt/runs/mavt-v1-alpha 2>&1 | tee -a /scratch/vunguyen13/mavt/runs/mavt-v1-alpha.log
#    (out of memory -> lower batch_video / batch_image, or add --use-checkpoint)
# Logs: <out>/log.jsonl (one json per --log-every steps); checkpoints <out>/last.pt + step_XXXXXXX.pt.
# Loss parts are logged unweighted (loss_rgb, loss_lpips, loss_gram, ...): after the first steps check
# that w_lpips * loss_lpips and w_gram * loss_gram are within ~0.3-3x of loss_rgb, and retune if not.

# ---- input
image_size: 256
patch: 16
# ---- tier A: frozen DINOv3 ViT-L/16 (local HF dir) + pixel stem
dino_repo: /scratch/vunguyen13/mavt/weights/dinov3-vitl16
dino_dim: 1024
dino_registers: 4
pix_dim: 256
# ---- tier B: trunk
dim: 1024
heads: 16
trunk_layers: 8
mlp_ratio: 4.0
temporal_window: 1
# ---- tier C: C at keyframes / D every frame
keyframe_every: 4
c_blocks: 2
d_tokens: 16
d_dim: 128
d_blocks: 2
use_track: false
use_event_memory: false
# ---- tier D: latent (budget 12 288 per image / per 4-frame segment)
zr_c_image: 48           # image: 256 x 48 = 12 288
zr_c_video: 32           # video: 256 x 32 + 4 x 16 x 64 = 8 192 + 4 096 = 12 288 (v0: 256 x 40 + 4 x 16 x 32)
zr_d: 64                 # D gets 2x the v0 share: it carries the motion and what C_k misses
zs_dim: 1024
# ---- tier E: query decoder
dec_dim: 768
dec_heads: 12
dec_blocks: 4
read_window: 2
gate_init_bias: 1.0      # o = sigmoid(.) starts at ~0.73: D is read from the start (v0: 4.0, ~0.98)
train_queries_per_frame: 256   # all N: the conv rgb head decodes full frames
delta_mode: query        # each query reads D for its own Δ (v0: one Δ field from the mean of D)
rgb_head: conv           # full-grid conv upsampler instead of the per-patch Linear (no patch grid)
conv_channels: [640, 384, 192, 96, 64]   # width at 16^2, then per x2 stage up to 256^2 (29.4 M params, 42 GMAC / frame)
conv_res_blocks: 2
# ---- loss weights
w_rgb: 1.0
w_lpips: 0.5             # rgb L1 at init measured 0.52 (this decoder, natural 256^2 image); LPIPS-VGG of a near-flat
                         # output ~0.6-0.8 (estimate: VGG16 weights not reachable in the sandbox) -> ~0.3-0.4
w_gram: 50.0             # Gram L1 (normalised by C*H*W, mean over the 5 VGG layers) ~3e-3-1e-2 at init (estimate) -> ~0.15-0.5
lpips_max_frames: 64     # LPIPS / Gram on at most 64 random full frames per step and GPU
w_feat: 1.0
w_fut: 0.5
w_fut_rgb: 0.5           # rgb L1 on the forecast frames
w_warp: 0.5              # non-key frames decoded with the gate locked to 1: Δ must carry the motion
w_var: 0.1
w_kl: 1.0e-6
w_sem: 0.5
w_gate: 0.01
gate_loss: hinge         # relu(gate_floor - mean o): only penalise D taking over (v0 "mean" pushed o to 1)
gate_floor: 0.5
# ---- forecasts of D
forecast_horizons: [1, 4]      # D_hat(t + 1) and D_hat(t + 4), each made at t (t + h < T)
forecast_residual: true        # D_hat = D_t + f(.), f zero-init: starts as copy-last

train:
  imagenet: /scratch/vunguyen13/data/imagenet-1k
  openvid: /scratch/vunguyen13/data/dino_v0_data/openvid1m   # dir -> its manifest.jsonl or all *.jsonl
  objaverse: /scratch/vunguyen13/data/objaverse-lvis-subset-v1
  video_tail: 1000         # last 1000 OpenVid manifest lines -> eval only (<out>/openvid_heldout.txt)
  objaverse_holdout: 500   # last 500 non-blank uids -> eval only (<out>/objaverse_heldout.txt)
  steps: 200000
  lr: 2.0e-4
  wd: 0.05
  warmup: 2000
  # batch sizes as in v0_alpha: to be tuned on the machine (the conv head decodes full frames,
  # ~120 MB of activations per frame in bf16, plus the forecast and warp-only decodes)
  batch_image: 32          # per GPU
  batch_video: 4           # per GPU, 8 frames each (2 segments of K=4)
  batch_3d: 4              # per GPU, objects of n_views posed views
  n_views: 4
  n_frames: 8
  frame_stride: "2,4,8"    # several strides: the forecasts see slow and fast motion (list parsing: trainer, in parallel)
  modality_weights: image:0.4,video:0.4,threed:0.2
  mix_modalities: true     # several modalities per step instead of one (trainer flag being added in parallel)
  grad_accum: 1
  bf16: true
  grad_clip: 1.0
  ckpt_every: 1000
  log_every: 20
  num_workers: 8
