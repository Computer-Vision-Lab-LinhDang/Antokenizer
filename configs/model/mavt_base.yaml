# MAVT base model configuration (Matryoshka edition)
model:
  embed_dim: 1152
  num_heads: 16
  num_blocks: 12
  patch_size: 16
  t_patch: 2
  latent_dim: 32
  semantic_dim: 768
  num_classes: null
  matryoshka_dims: [8, 64, 256, 512, 1152]
  # Decay α for small prefixes — d=8 has fundamentally higher recon/sem floor
  # (capacity-limited) and would otherwise dominate gradient under uniform α.
  matryoshka_alphas: {8: 0.05, 64: 0.15, 256: 0.3, 512: 0.5, 1152: 1.0}
  recon_prefix_policy: all      # 'all' | 'random' (MRL-E) | 'largest'
  dec_dim: 768
  num_dec_attn_blocks: 4
  r_s: 2
  r_t: 1
  use_gradient_checkpointing: true
  mlp_ratio: 4.0
  dropout: 0.0
  # Loss
  w_l1: 1.0
  w_lpips: 0.1
  w_kl: 1.0
  w_sem: 0.5
  w_aux: 0.01
