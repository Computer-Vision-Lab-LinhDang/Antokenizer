# Stage 2: Image + Video — SigLIP2 last 4 blocks unfrozen, LR = 5e-5
#
# Usage:
#   python train.py fit --config configs/model/mavt_base.yaml \
#                       --config configs/train/stage2_universal.yaml \
#                       --data.universal_data_root data/sample100-1 \
#                       --ckpt_path checkpoints/stage1/mavt-stage1-best.ckpt

trainer:
  max_steps: 200000
  devices: auto
  precision: bf16-mixed
  accumulate_grad_batches: 2       # effective batch = batch_size * 2 (compensates smaller batch)
  log_every_n_steps: 100
  val_check_interval: 2000   # validate every 2000 train batches (was 1 = every step)
  enable_checkpointing: true
  strategy:
    class_path: lightning.pytorch.strategies.DDPStrategy
    init_args:
      find_unused_parameters: true
      gradient_as_bucket_view: true
  use_distributed_sampler: false   # ModalityGroupedBatchSampler handles DDP distribution
  callbacks:
    # Best balanced — total weighted loss (recon + KL + sem + aux)
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/stage2/balanced
        filename: mavt-stage2-balanced-{step:07d}-{val/loss:.4f}
        save_top_k: 1
        monitor: val/loss
        mode: min
        every_n_train_steps: 5000
    # Best reconstruction — pixel L1 + LPIPS only (no KL / sem)
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/stage2/recon
        filename: mavt-stage2-recon-{step:07d}-{val/loss_recon:.4f}
        save_top_k: 1
        monitor: val/loss_recon
        mode: min
        every_n_train_steps: 5000
    # Best understanding — cosine distance to frozen vision teacher
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/stage2/sem
        filename: mavt-stage2-sem-{step:07d}-{val/loss_sem:.4f}
        save_top_k: 1
        monitor: val/loss_sem
        mode: min
        every_n_train_steps: 5000
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: lightning.pytorch.callbacks.RichProgressBar

model:
  training_stage: 2
  init_siglip2: true
  use_semantic_distill: true
  siglip2_model_name: google/siglip2-base-patch16-224
  w_l1: 1.0
  w_lpips: 0.1
  w_kl: 1.0          # MAVTLoss applies β_k = w_kl · (d_k / D_max) per prefix
  w_sem: 0.3
  w_aux: 0.0         # slot diversity disabled
  use_lpips: true
  warmup_steps: 500
  total_steps: 200000
  weight_decay: 0.01
  grad_clip: 1.0

data:
  active_modalities:
    - image
    - video
  universal_data_root: datasets/sample100-1
  image_resolution: 256
  video_frames: 16
  video_resolution: 256
  batch_size: 16       # reduced vs stage 1 due to video memory cost
  num_workers: 8
  pin_memory: true
  val_split: 0.1
  test_split: 0.1
