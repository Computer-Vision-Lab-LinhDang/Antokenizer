# Override for cd-split stage1 round 2 — saves under checkpoints/stage1_4/
# (parallel run on dgx02 alongside stage1_3 on dgx01)
trainer:
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/stage1_4/balanced
        filename: mavt-stage1_4-balanced-{step:07d}-{val/loss:.4f}
        save_top_k: 1
        monitor: val/loss
        mode: min
        every_n_train_steps: 5000
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/stage1_4/recon
        filename: mavt-stage1_4-recon-{step:07d}-{val/loss_recon:.4f}
        save_top_k: 1
        monitor: val/loss_recon
        mode: min
        every_n_train_steps: 5000
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/stage1_4/sem
        filename: mavt-stage1_4-sem-{step:07d}-{val/loss_sem:.4f}
        save_top_k: 1
        monitor: val/loss_sem
        mode: min
        every_n_train_steps: 5000
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: lightning.pytorch.callbacks.RichProgressBar
