# Stage 3: Image + Video + 3D — SigLIP2 fully unfrozen, LR = 2e-5
#
# Usage:
#   python train.py fit --config configs/model/mavt_base.yaml \
#                       --config configs/train/stage3_universal.yaml \
#                       --data.universal_data_root data/sample100-1 \
#                       --ckpt_path checkpoints/stage2/mavt-stage2-best.ckpt

trainer:
  max_steps: 50000
  devices: auto
  precision: bf16-mixed
  accumulate_grad_batches: 2
  log_every_n_steps: 50
  val_check_interval: 1000   # validate every 1000 train batches (was 1 = every step)
  enable_checkpointing: true
  strategy:
    class_path: lightning.pytorch.strategies.DDPStrategy
    init_args:
      find_unused_parameters: true
      gradient_as_bucket_view: true
  use_distributed_sampler: false   # ModalityGroupedBatchSampler handles DDP distribution
  callbacks:
    # Best balanced — total weighted loss (recon + KL + sem + aux)
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/stage3/balanced
        filename: mavt-stage3-balanced-{step:07d}-{val/loss:.4f}
        save_top_k: 1
        monitor: val/loss
        mode: min
        every_n_train_steps: 2500
    # Best reconstruction — pixel L1 + LPIPS only (no KL / sem)
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/stage3/recon
        filename: mavt-stage3-recon-{step:07d}-{val/loss_recon:.4f}
        save_top_k: 1
        monitor: val/loss_recon
        mode: min
        every_n_train_steps: 2500
    # Best understanding — cosine distance to frozen vision teacher
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/stage3/sem
        filename: mavt-stage3-sem-{step:07d}-{val/loss_sem:.4f}
        save_top_k: 1
        monitor: val/loss_sem
        mode: min
        every_n_train_steps: 2500
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: lightning.pytorch.callbacks.RichProgressBar

model:
  training_stage: 3
  init_siglip2: true
  use_semantic_distill: true
  siglip2_model_name: google/siglip2-base-patch16-224
  w_l1: 1.0
  w_lpips: 0.1
  w_kl: 1.0    # passthrough — KL pre-scaled by kl_weight=1e-4 in VAEHead
  w_clip: 0.0
  w_sem: 0.2
  w_aux: 0.0   # slot diversity disabled
  use_lpips: true
  use_clip: false
  warmup_steps: 500
  total_steps: 50000
  weight_decay: 0.01
  grad_clip: 1.0

data:
  active_modalities:
    - image
    - video
    - threed
  universal_data_root: datasets/sample100-1
  image_resolution: 256
  video_frames: 16
  video_resolution: 256
  triplane_res: 256
  batch_size: 8        # reduced further due to 3D triplane cost
  num_workers: 8
  pin_memory: true
  val_split: 0.1
  test_split: 0.1
