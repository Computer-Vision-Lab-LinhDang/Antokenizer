# Stage 2: Image + Video, SigLIP2 last 4 blocks unfrozen, 200K steps
trainer:
  max_steps: 200000
  precision: bf16-mixed
  gradient_clip_val: 1.0
  log_every_n_steps: 100
  val_check_interval: 5000
  enable_checkpointing: true
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/stage2
        filename: mavt-stage2-{step:07d}-{val/loss:.4f}
        save_top_k: 3
        monitor: val/loss
        mode: min
        every_n_train_steps: 5000
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: lightning.pytorch.callbacks.RichProgressBar

model:
  training_stage: 2
  init_siglip2: false
  w_l1: 1.0
  w_lpips: 0.1
  w_clip: 0.0
  w_aux: 0.01
  use_lpips: true
  warmup_steps: 500
  total_steps: 200000
  weight_decay: 0.01

data:
  active_modalities:
    - image
    - video
  image_resolution: 256
  video_frames: 16
  video_resolution: 256
  batch_size: 16     # reduced for video
  num_workers: 8
  # video_root: /path/to/webvid
