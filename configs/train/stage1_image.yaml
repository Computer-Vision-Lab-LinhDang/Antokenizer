# Stage 1: Image only, SigLIP2 frozen, 200K steps
trainer:
  max_steps: 200000
  devices: 2
  precision: bf16-mixed
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1
  log_every_n_steps: 100
  val_check_interval: 1
  enable_checkpointing: true
  strategy: ddp_find_unused_parameters_true
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/stage1
        filename: mavt-stage1-{step:07d}-{val/loss:.4f}
        save_top_k: 3
        monitor: val/loss
        mode: min
        every_n_train_steps: 5000
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: lightning.pytorch.callbacks.RichProgressBar

model:
  training_stage: 1
  init_siglip2: false        # set true to load SigLIP2 weights
  siglip2_model_name: google/siglip2-base-patch16-224
  w_l1: 1.0
  w_lpips: 0.1
  w_clip: 0.0
  w_aux: 0.01
  use_lpips: true
  use_clip: false
  warmup_steps: 1000
  total_steps: 200000
  weight_decay: 0.01
  grad_clip: 1.0

data:
  active_modalities:
    - image
  image_resolution: 256
  batch_size: 32
  num_workers: 8
  pin_memory: true
  # image_root: /path/to/open-images   # uncomment for real data
