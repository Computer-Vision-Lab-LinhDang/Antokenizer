# Grain-Prior C-D v1 (src/mavt/grain_prior): anchor grains + coarse memory + causal records on a frozen DINOv3.
# Reference configuration; weights and temperatures are starting values, not tuned.
#
# Top-level keys are GrainPriorConfig fields; `train:` holds defaults for the scripts/train_grain_prior.py flags
# (the command line wins). Data paths go on the command line:
#   torchrun --standalone --nproc_per_node N scripts/train_grain_prior.py --config configs/grain_prior/base.yaml \
#     --imagenet <parquet root> --openvid <manifest> --objaverse <render root> --objaverse-depth \
#     --omniworld <pack> --omniworld-modality world --omniworld-scenes 30 --out <run>
# Arms: --set geom_bias=false | --set query_init=uncond | --set memory=false
# Ledger: image 6 180 scalars, full state (three targets, L = 52) 12 242.

# ---- input and frozen DINOv3 ViT-L/16 (HF id or a local copy)
image_size: 256
patch: 16
dino_repo: facebook/dinov3-vitl16-pretrain-lvd1689m
dino_dim: 1024
dino_registers: 4
dino_layers: [24]              # F_i: the last layer is the feature target
# ---- trunk: 6 blocks per stream, width 512, 8 heads, FFN 2048
dim: 512
heads: 8
mlp_ratio: 4.0
layers: 6
stem_channels: [64, 128, 256, 512]
pe_freq: 8
mlp_hidden: 512
# ---- anchor C: 64 grains (u 2, rho, sigma, f 60), c_0 16 x 128, kappa_0
stratum: 2
d_f: 60
coarse_grid: 4
d_coarse: 128
grain_blocks: 2
grain_read_s: 1.0
sigma_min: 0.4
sigma_span: 1.1
rho_lo: -7.0
rho_hi: 5.0
temp_s: 1.0
# ---- target record D_i: xi 6, M 16 x 3, kappa 4, b 16 x 2, r L x 24 (L <= 52)
n_motion: 16
d_b: 2
n_slots: 52
d_e: 20
queue: 3
nested_L: [0, 8, 16, 32, 52]
# ---- cameras
fov_min: 30.0
fov_max: 120.0
fov_init: 50.0
pp_range: 0.05
z_eps: 0.01
# ---- refinement, memory, residual encoder, public decoder, prior
refine_passes: 2
upd_blocks: 2
corr_eps: 0.05
corr_s: [3.0, 1.5]
frame_seconds: 0.125
res_layers: 4
read_layers: 2
tau_d: 0.1
tau_d_mode: median
rgb_channels: [256, 128, 64, 32]
prior_layers: 6
horizons: [1, 4]
# ---- arms
query_init: cond
geom_bias: true
memory: true
# ---- training
phase: codec
world_given_p: 0.5
w_lpips: 0.1
w_logn: 0.01
w_base: 0.5
w_init: 0.25
w_geom: 1.0
w_pose: 0.1
w_motion: 0.001
w_code: 0.0001
depth_delta: 0.1
lpips_max_frames: 64

train:
  steps: 2000
  lr: 3.0e-4
  wd: 0.05
  warmup: 200
  batch_image: 64
  batch_video: 32
  batch_3d: 16
  batch_world: 32
  n_views: 4
  n_frames: 4
  frame_stride: "4,8,16"
  omniworld_stride: "2,4,8"
  mix_modalities: true
  compile: false
  grad_accum: 1
  bf16: true
  grad_clip: 1.0
  ckpt_every: 500
  log_every: 20
  num_workers: 8
