# Grain-Prior final run: the CRSR reader with query_grid 64 (the s1-s3 line) plus the 2026-10 flags 1.1, 1.4, 1.5,
# 2.1, 2.2, 2.3, 3.3, 3.4 and the Muon / WSD trainer. Curriculum (scripts/grain_prior_final.sh): T1 image, T2 + 3D
# (--set w_geom_ramp_steps=2000), T3 + video, T4 + world; every stage --init from the previous one.
#
# Top-level keys are GrainPriorConfig fields; `train:` holds defaults for the scripts/train_grain_prior.py flags
# (the command line wins). Data paths go on the command line:
#   torchrun --standalone --nproc_per_node N scripts/train_grain_prior.py --config configs/grain_prior/base.yaml \
#     --imagenet <parquet root> --openvid <manifest> --objaverse <render root> --objaverse-depth \
#     --omniworld <pack> --omniworld-modality world --omniworld-scenes 30 --out <run>
# Arms: --set geom_bias=false | --set query_init=uncond | --set memory=false
# Ledger: stratum 1, d_f 12: 256 grains x 16 + c_0 2 048 + header / kappa (as the s1-s3 runs).

# ---- input and frozen DINOv3 ViT-L/16 (HF id or a local copy)
image_size: 256
patch: 16
dino_repo: facebook/dinov3-vitl16-pretrain-lvd1689m
dino_dim: 1024
dino_registers: 4
dino_layers: [8, 16, 24]       # F_i: the last layer is the feature target; 8, 16 -> F_mid (1.4)
# ---- trunk: 6 blocks per stream, width 512, 8 heads, FFN 2048
dim: 512
heads: 8
mlp_ratio: 4.0
layers: 6
stem_channels: [64, 128, 256, 512]
pe_freq: 8
mlp_hidden: 512
# ---- anchor C: 64 grains (u 2, rho, sigma, f 60), c_0 16 x 128, kappa_0
stratum: 1
d_f: 12
coarse_grid: 4
d_coarse: 128
grain_blocks: 2
grain_read_s: 1.0
sigma_min: 0.15
sigma_span: 1.1
rho_lo: -7.0
rho_hi: 5.0
temp_s: 1.0
# ---- target record D_i: xi 6, M 16 x 3, kappa 4, b 16 x 2, r L x 24 (L <= 52)
n_motion: 16
d_b: 2
n_slots: 52
d_e: 20
queue: 3
nested_L: [0, 8, 16, 32, 52]
# ---- cameras
fov_min: 30.0
fov_max: 120.0
fov_init: 50.0
image_fov_fixed: true
pp_range: 0.05
z_eps: 0.01
# ---- refinement, memory, residual encoder, public decoder, prior
refine_passes: 2
upd_blocks: 2
corr_eps: 0.05
corr_s: [3.0, 1.5]
frame_seconds: 0.125
res_layers: 4
read_layers: 2
tau_d: 0.1
tau_d_mode: median
rgb_channels: [256, 128, 64, 32]
# ---- CRSR reader (strict legacy readout, coarse init, zero-value sink, projected radius), RGB on a 64 x 64 read
readout_version: legacy
read_strict: true
read_coarse_init: true
read_sink: true
read_radius_scale: true
read_radius_clip: 8.0
sigma_param: log
rgb_from: hidden
query_grid: 64
query_chunk: 512
# ---- 2026-10 flags
innov_stopgrad_base: true      # 1.1
dino_multi_layer: true         # 1.4
read_prev_frame: true          # 1.5 (video / world only)
w_pred_frame: 0.5
read_coarse_kv: true           # 2.1 (+ sink)
read_relpos_value: true        # 2.2 (query chunks of query_chunk)
relpos_rank: 8
rgb_coarse_start: true         # 2.3
w_rgb_coarse: 1.0
rgb_head: pointwise            # 3.3
read_split_layer2: true        # 3.4
prior_layers: 6
horizons: [1, 4]
# ---- arms
query_init: cond
geom_bias: true
memory: true
# ---- training
phase: codec
world_given_p: 0.5
w_lpips: 0.1
w_logn: 0.01
w_base: 0.5
w_init: 0.25
w_geom: 1.0
w_pose: 0.1
w_motion: 0.001
w_code: 0.0001
depth_delta: 0.1
lpips_max_frames: 64

train:
  optimizer: muon
  schedule: wsd
  lr: 2.0e-4
  min_lr_ratio: 0.0
  wd: 0.05
  warmup: 1000
  decay_steps: 4000
  ema: 0.999
  clip_mode: median
  clip_mult: 2.0
  clip_window: 200
  grad_clip: 1.0
  skip_gn: 1000.0
  batch_image: 96
  batch_video: 32
  batch_3d: 24
  batch_world: 8
  n_views: 4
  n_frames: 4
  frame_stride: "4,8,16"
  omniworld_stride: "2,4,8"
  mix_modalities: true
  compile: true
  grad_accum: 1
  bf16: true
  ckpt_every: 1000
  log_every: 25
  num_workers: 12
